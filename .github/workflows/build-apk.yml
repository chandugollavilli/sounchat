name: Build SoundChat Debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    name: Test & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK & accept licenses
        uses: android-actions/setup-android@v3

      - name: Restore debug keystore from base64
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit & Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon --console=plain

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --console=plain

      - name: Upload SoundChat Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SoundChat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
